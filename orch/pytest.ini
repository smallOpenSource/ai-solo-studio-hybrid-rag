[pytest]
# orch deterministic suite — isolated from the repo's root pyproject pytest
# config (which assumes pytest-timeout / markers not installed in the orch env).
# Model calls are STUBBED here; the live/real-gemma e2e is a separate lane.
addopts = -q -p no:cacheprovider
testpaths = tests
markers =
    slow: boots a real socket server (deterministic, no model network) — the drop-in
        contract proof; deselect with -m 'not slow'.
