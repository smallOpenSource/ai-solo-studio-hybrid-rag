<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>가마 공방 — Kiln Craft</title>
<style>
  html, body { margin: 0; background: #1c1410; color: #f0e3d2; font-family: monospace; touch-action: manipulation; }
  /* 모바일: 화면폭 맞춤(종횡비 보존·intrinsic 480×420 상한)·더블탭 줌/300ms 지연 차단 */
  #game { display: block; margin: 16px auto; max-width: 96vw; height: auto; background: #120c09; border: 2px solid #c98a3c; image-rendering: pixelated; touch-action: manipulation; }
  p { text-align: center; color: #b59a7c; margin: 8px 16px; font-size: 13px; }
  /* 명성 게이트(AC4): tier 상승 시 해금 안내가 여기 렌더(상태게이트+렌더노출). */
  #unlock { color: #8fd6a0; min-height: 18px; font-style: italic; }
  #unlock:empty { display: none; }
  #mute { position: fixed; top: 8px; right: 8px; z-index: 10; font-size: 18px; background: #1c1410; color: #f0e3d2; border: 1px solid #6b5440; border-radius: 6px; padding: 6px 10px; touch-action: manipulation; cursor: pointer; }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="음소거 토글">🔊</button>
<canvas id="game" width="480" height="420"></canvas>
<p>점토를 <b>빚기 → 굽기 → 유약</b> 순서대로 가공하면 완성품이 됩니다. 판매하면 코인과 명성이 함께 오르고, 명성이 임계를 넘으면 더 좋은 점토가 해금됩니다.</p>
<!-- 명성 게이트(AC4): tier 상승 시 상위 점토 해금 한 줄이 여기 렌더(창발 게이트). -->
<p id="unlock" aria-live="polite"></p>
<script src="../_audio.js"></script>
<script>
(function () {
  "use strict";

  // ── 오디오(절차적 칩튠·_audio.js 공유·미로드 시 no-op 비차단·코어 미편집·기존 API 만) ──────
  var A = window.GameAudio ? window.GameAudio({
    master: 0.2, noteDur: 0.22,
    bgm: [523, 587, 659, 587, 440, 523, 392, 440],            // C D E D · A C G A (잔잔·동아시아 펜타토닉)
    sfx: function (au) {
      return {
        shape:  function () { au.tone(440, 0.08, "triangle", 0.4); },                 // 물레로 빚기
        fire:   function () { au.chord([196, 294], 0.22, "square", 0.4, 90); },        // 가마 굽기(저음)
        glaze:  function () { au.tone(784, 0.1, "sine", 0.4); },                       // 유약 시유(고음)
        sell:   function () { au.chord([523, 659], 0.14, "triangle", 0.45, 80); },     // 판매
        tierup: function () { au.chord([523, 659, 880], 0.34, "triangle", 0.5, 120); } // 명성 임계·상위재료 해금
      };
    },
  }) : { unlock: function () {}, play: function () {}, toggleMute: function () { return false; }, isUnlocked: function () { return false; } };

  // ── 결정론 상태 (RNG 없음·외부 의존 0·wall-clock 비의존·턴제 공예) ─────────────────
  // 계약 = vault/specs/kiln-craft.md(handoff 브리프 acceptance_criteria)와 1:1.
  // state_shape: piece,coin,reputation,tier · init: coin=0 reputation=0 tier=0
  var SHAPE_Q = 2, FIRE_Q = 3, GLAZE_Q = 2;          // 단계별 품질 기여(각 단계가 quality 에 가산·단일 done 불가)
  var CLAY_BASE = [0, 4, 8];                          // tier 0/1/2 점토 base 품질(상위재료=상위 base)
  var PRICE_MULT = 3, REP_MULT = 1;                   // price=quality*3, rep=quality*1(둘 다 quality 순수 함수)
  var REP_THRESHOLD = [10, 30];                       // tier 0->1 at rep 10, tier 1->2 at rep 30(명성 게이트)
  var CLAY = [                                         // 도예 1종(사케/차/서예 = Must-NOT)·tier 점토
    { id: "earthen",   name: "질그릇 점토", color: "#a86b42" },
    { id: "stoneware", name: "석기 점토",   color: "#8a9bb0" },
    { id: "porcelain", name: "백자 점토",   color: "#e3e8ef" }
  ];

  var state = { piece: null, coin: 0, reputation: 0, tier: 0 };

  // 새 작품 = 현재 tier 의 점토로 시작(raw·step 0). tier 가 오르면 다음 작품 base 가 올라 품질 창발.
  function freshPiece() {
    var t = Math.min(state.tier, CLAY.length - 1);
    return {
      clay: CLAY[t].id, clayTier: t, base: CLAY_BASE[t],
      shaped: false, fired: false, glazed: false,
      step: 0,                                         // 0=raw · 1=shaped · 2=fired · 3=glazed(done)
      quality: 0, done: false
    };
  }
  state.piece = freshPiece();

  window.__state = state;                             // 테스트훅(헤드리스 상태 단언·R2 명명)
  // brief↔게임 drift 교차검증(하드코딩 적발) — 경제 계수·명성 임계·단계 기여·점토 base.
  window.__constants = {
    PRICE_MULT: PRICE_MULT, REP_MULT: REP_MULT, REP_THRESHOLD: REP_THRESHOLD.slice(),
    SHAPE_Q: SHAPE_Q, FIRE_Q: FIRE_Q, GLAZE_Q: GLAZE_Q, CLAY_BASE: CLAY_BASE.slice()
  };

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var unlockEl = document.getElementById("unlock");
  var lastUnlock = "";

  // 액션 버튼 사각형(render 와 pointer 가 공유·고정 좌표 → 적중 결정론).
  var SHAPE_BTN = { x: 18,  y: 282, w: 140, h: 46 };
  var FIRE_BTN  = { x: 170, y: 282, w: 140, h: 46 };
  var GLAZE_BTN = { x: 322, y: 282, w: 140, h: 46 };
  var SELL_BTN  = { x: 18,  y: 346, w: 444, h: 54 };

  // ── 경제 순수 함수(quality 만의 함수·direct-set 아님) ───────────────────────────
  function price(q)   { return q * PRICE_MULT; }      // 가격 = 품질의 단조 순수 함수
  function repGain(q) { return q * REP_MULT; }        // 명성 = 품질의 순수 함수(가격과 독립 계수)

  // 명성 게이트(AC4): reputation 이 임계를 넘으면 tier 창발(창발·monotonic·direct-set 아님).
  //   story-idle revealBeats 동형 — while 로 한 번에 여러 임계 통과 가능·tier 미회귀(소비 없음)·bounded.
  function checkTierUp() {
    while (state.tier < REP_THRESHOLD.length &&
           state.reputation >= REP_THRESHOLD[state.tier]) {
      state.tier += 1;
      var nt = Math.min(state.tier, CLAY.length - 1);
      lastUnlock = "명성 " + REP_THRESHOLD[state.tier - 1] + " 달성 — " + CLAY[nt].name + " 해금!";
      A.play("tierup");
    }
  }

  // ── [CORE] 공예 시퀀스(순서 결합·anti-hollow) ──────────────────────────────────
  //   각 액션은 직전 단계가 끝났을 때만(step 검사) 성공하고 quality 에 자기 몫을 가산한다.
  //   순서 위반/단계 누락 → 거부(false·piece 불변·negative). 단일 'done 플래그'로는 완성 불가.
  function doShape() {                                // 빚기: raw(step 0) 일 때만 → step 1
    var p = state.piece;
    if (!p || p.step !== 0) return false;
    p.shaped = true; p.step = 1;
    p.quality += SHAPE_Q + p.base;                    // 빚기 기여 + 점토 base(재료 품질 realized)
    A.play("shape"); render(); return true;
  }
  function doFire() {                                 // 굽기: shaped(step 1) 일 때만 → step 2(빚기 없이 굽기 불가)
    var p = state.piece;
    if (!p || p.step !== 1) return false;
    p.fired = true; p.step = 2;
    p.quality += FIRE_Q;                              // 굽기 기여
    A.play("fire"); render(); return true;
  }
  function doGlaze() {                                // 유약: fired(step 2) 일 때만 → step 3·done(굽기 없이 유약 불가)
    var p = state.piece;
    if (!p || p.step !== 2) return false;
    p.glazed = true; p.step = 3; p.done = true;
    p.quality += GLAZE_Q;                             // 유약 기여 → 완성
    A.play("glaze"); render(); return true;
  }

  // 판매 결합(AC3): piece.done 일 때만 → coin+=price(quality) AND reputation+=rep(quality)(동시 창발).
  //   판매 후 현 tier 점토로 새 작품 자동 개시(루프 지속). 미완성 판매 거부(negative).
  function doSell() {
    var p = state.piece;
    if (!p || !p.done) return false;                  // 미완성 판매 거부(negative·상태 불변)
    var q = p.quality;
    state.coin += price(q);                           // 결합: 가격 창발
    state.reputation += repGain(q);                   // 결합: 명성 동시 창발(단일 카운터 불가)
    checkTierUp();                                    // 명성 임계 → tier 창발(상위재료 해금)
    state.piece = freshPiece();                       // 새 작품(현 tier 점토·tier-up 시 품질 창발)
    A.play("sell"); render(); return true;
  }

  function resetGame() {                              // AC: init 복원(같은 객체 변이·훅 참조 보전·런 간 잔존 0)
    state.coin = 0; state.reputation = 0; state.tier = 0;
    state.piece = freshPiece();
    lastUnlock = "";
    render();
  }

  // 헤드리스 테스트 API — Canvas 실입력과 **동일 로직**(QA가 page.evaluate 로 구동·우회 아님).
  window.__shape = doShape;
  window.__fire = doFire;
  window.__glaze = doGlaze;
  window.__sell = doSell;
  window.__resetGame = resetGame;
  // ★direct-set 금지: __setTier/__setQuality/__setState 류 직접세터를 일절 노출하지 않는다(창발만).

  function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

  // Pointer Events = 마우스·펜·터치 단일 경로. ★CSS 스케일 보정: 캔버스가 max-width 로 축소되면
  // rect.width≠canvas.width → (client-rect)에 비율(canvas/rect)을 곱해야 내부 좌표가 맞다(clicker 동형).
  canvas.addEventListener("pointerdown", function (e) {
    A.unlock();                                       // 첫 제스처서 오디오 unlock(autoplay 정책)
    var rect = canvas.getBoundingClientRect();
    var sx = canvas.width / rect.width, sy = canvas.height / rect.height;
    var x = (e.clientX - rect.left) * sx, y = (e.clientY - rect.top) * sy;
    if (inRect(x, y, SHAPE_BTN)) doShape();           // 실입력도 훅과 동일 함수 경유(우회 아님)
    else if (inRect(x, y, FIRE_BTN)) doFire();
    else if (inRect(x, y, GLAZE_BTN)) doGlaze();
    else if (inRect(x, y, SELL_BTN)) doSell();
  });

  // ── 렌더 ────────────────────────────────────────────────────────────────────────
  function drawButton(r, label, enabled, active, accent) {
    ctx.fillStyle = enabled ? (active ? accent : "#3a2c20") : "#241a13";
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = enabled ? "#c98a3c" : "#4a3a2a"; ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = enabled ? (active ? "#120c09" : "#f0e3d2") : "#6b5440";
    ctx.font = "bold 15px monospace"; ctx.textAlign = "center";
    ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 5);
    ctx.textAlign = "left";
  }

  // 작품 비주얼 — step 에 따라 raw 덩어리 → 빚은 형태 → 구운 도기 → 유약 광택.
  function drawPiece(p) {
    var cx = 240, cy = 200, clayColor = CLAY[Math.min(p.clayTier, CLAY.length - 1)].color;
    // 물레/작업대
    ctx.fillStyle = "#2a1d14"; ctx.beginPath();
    ctx.ellipse(cx, cy + 64, 96, 20, 0, 0, Math.PI * 2); ctx.fill();

    if (p.step === 0) {                               // raw: 점토 덩어리(갈색·미가공)
      ctx.fillStyle = "#7a4d2e"; ctx.beginPath();
      ctx.ellipse(cx, cy + 28, 56, 42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#5e3a22"; ctx.beginPath();
      ctx.ellipse(cx - 12, cy + 32, 22, 16, 0, 0, Math.PI * 2); ctx.fill();
    } else {                                           // shaped+: 항아리 실루엣(빚은 형태)
      var body = clayColor;
      if (p.step === 2) body = shade(clayColor, -0.28);        // fired: 가마에 구워 짙어짐
      else if (p.step === 3) body = shade(clayColor, -0.16);   // glazed: 유약 후 살짝 회복
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(cx - 20, cy - 40);                   // 목
      ctx.lineTo(cx + 20, cy - 40);
      ctx.quadraticCurveTo(cx + 64, cy - 8, cx + 50, cy + 40);  // 어깨~몸통(우)
      ctx.quadraticCurveTo(cx + 40, cy + 66, cx, cy + 68);      // 굽(우)
      ctx.quadraticCurveTo(cx - 40, cy + 66, cx - 50, cy + 40); // 굽(좌)
      ctx.quadraticCurveTo(cx - 64, cy - 8, cx - 20, cy - 40);  // 어깨~몸통(좌)
      ctx.closePath(); ctx.fill();
      // 입구(림)
      ctx.fillStyle = shade(body, -0.2);
      ctx.beginPath(); ctx.ellipse(cx, cy - 40, 20, 6, 0, 0, Math.PI * 2); ctx.fill();
      if (p.step === 3) {                             // glazed: 광택 하이라이트(유약 sheen)
        ctx.fillStyle = "rgba(255,255,255,0.32)";
        ctx.beginPath(); ctx.ellipse(cx - 18, cy + 6, 9, 26, -0.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(cx, cy + 10, 48, 50, 0, -0.6, 0.6); ctx.stroke();
      }
    }
  }

  // 색 음영 보정(유틸·hex → 밝게/어둡게).
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    function adj(v) { return Math.max(0, Math.min(255, Math.round(v + 255 * amt))); }
    return "rgb(" + adj(r) + "," + adj(g) + "," + adj(b) + ")";
  }

  function render() {
    var p = state.piece;
    ctx.fillStyle = "#120c09"; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 상단 HUD: 코인·명성·tier·점토
    ctx.fillStyle = "#f0e3d2"; ctx.font = "14px monospace"; ctx.textAlign = "left";
    ctx.fillText("코인(coin): " + state.coin, 18, 28);
    ctx.fillText("명성(reputation): " + state.reputation, 18, 50);
    var clayName = CLAY[Math.min(state.tier, CLAY.length - 1)].name;
    ctx.fillStyle = "#c98a3c";
    ctx.fillText("등급(tier): " + state.tier + " · " + clayName, 18, 72);
    if (state.tier < REP_THRESHOLD.length) {
      ctx.fillStyle = "#b59a7c"; ctx.font = "11px monospace"; ctx.textAlign = "right";
      ctx.fillText("다음 해금: 명성 " + REP_THRESHOLD[state.tier], canvas.width - 18, 50);
      ctx.textAlign = "left";
    }

    // 작품 + 품질
    drawPiece(p);
    var stepLabel = ["원료(점토)", "빚은 형태", "구운 도기", "완성(유약)"][p.step];
    ctx.fillStyle = "#f0e3d2"; ctx.font = "13px monospace"; ctx.textAlign = "center";
    ctx.fillText(stepLabel + "  ·  품질(quality): " + p.quality, 240, 110);
    // 단계 진행 표시(1.빚기 → 2.굽기 → 3.유약)
    ctx.font = "12px monospace";
    var stages = [["1 빚기", p.step >= 1], ["2 굽기", p.step >= 2], ["3 유약", p.step >= 3]];
    for (var i = 0; i < stages.length; i++) {
      ctx.fillStyle = stages[i][1] ? "#8fd6a0" : "#6b5440";
      ctx.fillText((stages[i][1] ? "● " : "○ ") + stages[i][0], 120 + i * 120, 132);
    }
    ctx.textAlign = "left";

    // 액션 버튼(다음 단계만 active·순서 결합 가시화)
    drawButton(SHAPE_BTN, "빚기", p.step === 0, p.step === 0, "#e0a85a");
    drawButton(FIRE_BTN,  "굽기", p.step === 1, p.step === 1, "#e0a85a");
    drawButton(GLAZE_BTN, "유약", p.step === 2, p.step === 2, "#e0a85a");
    drawButton(SELL_BTN, p.done ? ("판매하기  (+코인 " + price(p.quality) + " · +명성 " + repGain(p.quality) + ")") : "판매 (완성 후)", p.done, p.done, "#5ec98a");

    // 명성 게이트 해금 안내 DOM 렌더 소비(AC4: tier 상승 시 상위재료 해금 노출)
    if (unlockEl) unlockEl.textContent = lastUnlock;
  }

  render();

  // 뮤트 버튼: 첫 탭=사운드 켜기(unlock)·이후=뮤트 토글(clicker/story-idle 동형).
  var muteBtn = document.getElementById("mute");
  if (muteBtn) muteBtn.addEventListener("click", function () {
    if (!A.isUnlocked()) A.unlock();
    else muteBtn.textContent = A.toggleMute() ? "🔇" : "🔊";
  });
})();
</script>
</body>
</html>
