  //   챕터별 화음 팔레트(베이스). 정적 동시 코드가 아니라, 아래 __ambientPlan 이 챕터별 셰이프로 성부를
  //   시간 엇갈림(at) 시퀀스화 → "모티프"(성부열). 챕터 distinct·순수(chapter 만의 함수).
  var AMBIENT_CHORD = [
    [130.81, 196.00, 261.63],  // C3 G3 C4 — 유년(따뜻)
    [146.83, 220.00, 293.66],  // D3 A3 D4 — 학창(맑음)
    [110.00, 164.81, 220.00],  // A2 E3 A3 — 사회초년(차분)

  // 챕터별 모티프 셰이프(코드 degree 인덱스 순서). 챕터마다 상이 → 같은 베이스라도 모티프 윤곽이 갈린다.
  var AMBIENT_SHAPE = [
    [0, 2, 1, 2],  // 유년: 펼침(open)
    [0, 1, 2, 1],  // 학창: 상승-회귀(rise)
    [2, 1, 0, 1],  // 사회초년: 하행(descend)
    [0, 2, 1, 0]   // 현재: 수렴(return)
  ];
  var AMBIENT_STEP = 0.55;     // 성부 간 시간 엇갈림(초) — 정적 동시 코드가 아닌 모티프 시퀀스
  // 순수 함수(M-AC9): chapter → 앰비언트 모티프 성부열([{freq, at}...]). 외부 state read 금지(인자만의 함수·
  //   동일 chapter→동일 plan). 챕터 distinct(베이스 화음 상이 + 셰이프 상이). bounded(챕터 수=4·초과 금지).
  function __ambientPlan(chapter) {
    var len = AMBIENT_CHORD.length;
    var idx = ((chapter - 1) % len + len) % len;
    var base = AMBIENT_CHORD[idx], shape = AMBIENT_SHAPE[idx], voices = [];
    for (var i = 0; i < shape.length; i++) {

    return voices;

  function playAmbient() { try { A.ambient(__ambientPlan(state.chapter)); } catch (e) {} }

  function makePRNG(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var SEED = 0x6D3A2F;

        { id: "frame2", label: "사진액자", color: "#c95e8b", slot: "stand", vignette: "협탁에 둔 사진, 멀어진 사람들이 거기 있었다." },

      ],
      beat: "마지막 짐을 싸니, 처음 받은 월급과 낯선 도시의 밤이 함께 밀려온다.",
      choices: [

        { id: "glasses", label: "돋보기", color: "#5ec9b0", slot: "table4", vignette: "탁자에 놓인 돋보기, 작아진 글씨들." },
        { id: "album", label: "앨범", color: "#c95e8b", slot: "memorybox", vignette: "오래된 앨범, 손때 묻은 모서리." }

  // ── 에필로그 합성(AC7 carry-forward) — 누적 선택 choices[] 의 순수 함수. ──────────
  //   챕터별 프래그먼트(선택 a/b 별 상이)를 위치 합성 → 어느 챕터 선택이 바뀌어도 결과가 갈린다
  //   (ch1·ch2·ch3·ch4 전부 변인). 위치 고정이라 교차 충돌 없음·동일 choices→동일 출력(순수).
  var EPILOGUE_FRAG = [
    { a: "간직한 곰인형처럼 그는 옛 온기를 평생 품었고,", b: "동생에게 물려준 그날처럼 그는 일찍 나눔을 배웠고," },

    { a: "이제 그는 창가에 앉아 지나온 방들을 고요히 바라본다.", b: "이제 그는 문을 열고 다음 방을 향해 천천히 걸어간다." }

  // ── 에필로그 패턴 코다(M-AC10·선택 *패턴* 의 순수 함수·≤3 티어·bounded) ──────────────────
  //   위치별 프래그먼트(개별 선택)와 별개로, 누적 선택의 *모양*(일관/균형/전환)을 한 줄 코다로 부가한다.
  //   순수: choices 벡터만의 함수. 패턴 기반(위치 무관) — 분포가 같으면 위치가 달라도 동일 코다(aaaa≡bbbb·
  //   abab≡aabb). ≤3 티어(천장): 0=일관(전부 동일)·1=균형(동수 2:2)·2=전환(치우침 3:1).
  var EPILOGUE_CODA = [
    "지나온 선택들은 한결같아, 그 일관됨이 한 사람의 결을 이루었다.",   // 0 일관
    "머뭇거림과 결단이 고르게 갈마들어, 그 균형이 삶에 너비를 주었다.", // 1 균형
    "어느 길목에서 마음이 크게 돌아서, 그 전환이 삶의 방향을 바꾸었다."  // 2 전환
  ];
  // 순수: 유효 선택(미선택 무시)의 분포로 티어 결정. 개별 선택값이 아닌 *패턴* 함수(위치 무관).
  function epilogueCoda(choices) {
    var counts = {}, n = 0;
    for (var i = 0; i < EPILOGUE_FRAG.length; i++) {
      var c = choices && choices[i];
      if (c == null) continue;
      counts[c] = (counts[c] || 0) + 1; n++;
    }
    if (n === 0) return EPILOGUE_CODA[0];
    var max = 0;
    for (var k in counts) { if (counts[k] > max) max = counts[k]; }
    var minority = n - max;                                  // 0=전부 동일 · 동수면 max

  // 순수: 외부 state read 금지 — 인자 choices 벡터만의 함수. 미선택/미지 선택은 빈 프래그먼트로 안전.
  //   M-AC10 가산: 기존 4-위치 프래그먼트 합성 보존 + 선택 패턴 코다(순수·≤3·기존 ch1/ch2 distinct 보존).

  // ── 결정론 상태 + 테스트 훅 ────────────────────────────────────────────────────
  // 계약 = vault/specs/memoir-room.md(handoff 브리프) 와 1:1. placed = { slotId: itemId }.
  var state = {
    chapter: 1, totalChapters: CHAPTERS.length, placed: {},
    narrativeBeatShown: false, branch: null, hintOn: false, phase: "placing",
    // ── R2 가산(기존 필드 보존): 누적 선택·마지막 비네트·에필로그 ──
    choices: [],            // choices[chapter-1]=choiceId (idempotent 인덱스 덮어쓰기·append 금지)

  var trayOrder = [];            // 현재 챕터 트레이 표시 순서(시드 고정 셔플)

  function curChapter() { return CHAPTERS[state.chapter - 1]; }
  function curItems() { return curChapter().items; }
  function curSlots() { return curChapter().slots; }
  function itemById(id) { return curItems().filter(function (i) { return i.id === id; })[0] || null; }
  function slotById(id) { return curSlots().filter(function (s) { return s.id === id; })[0] || null; }

  function layoutTray() {
    var rng = makePRNG(SEED + state.chapter * 1009);

    for (var i = ids.length - 1; i > 0; i--) {

  function trayItemRects() {
    var out = [];

    return out;

  // ── 핵심 액션 ──────────────────────────────────────────────────────────────────

    return Object.keys(state.placed).length === curItems().length;
  }

  // 배치: slotId 가 item.home 일 때만 placed[slotId]=itemId. 틀린 슬롯/점유/중복은 거부(negative).
  // 결합 불변식: 전 슬롯 충족 시에만 narrativeBeatShown=true(여기 안에서만 세팅 → 창발).
  function placeItem(itemId, slotId) {
    if (state.phase !== "placing") return false;
    var it = itemById(itemId);
    if (!it || !slotById(slotId)) return false;       // 미지의 아이템/슬롯
    if (state.placed[slotId]) return false;           // 점유된 슬롯
    if (isPlaced(itemId)) return false;               // 이미 배치된 아이템
    if (it.slot !== slotId) { A.play("reject"); return false; }  // 틀린 슬롯 → 거부(negative)
    state.placed[slotId] = itemId;
    state.lastVignette = it.vignette;                 // AC8: 배치 성공 → 그 물건의 한 줄 회상(아이템별 상이·창발)
    A.play("place");

      state.phase = (state.chapter === state.totalChapters) ? "complete" : "beat";
      A.play("beat");
    }
    render();
    return true;
  }

  // 다음 챕터: 현재 챕터 정리완료(narrativeBeatShown) 일 때만 chapter+1, 방 상태 리셋.
  function advanceChapter() {
    if (state.chapter >= state.totalChapters) return false;

    state.chapter += 1;
    state.placed = {};
    state.narrativeBeatShown = false;
    state.lastVignette = null;                          // 다음 방: 회상 초기화(누적 choices 는 보존)
    state.branch = null;                               // resetGame 과 대칭: 다음 챕터 선택지 게이트(branch==null) 복구
    // ★carry 불변식: state.choices 는 여기서 건드리지 않는다(챕터 간 누적 보존). resetGame 만 비운다.
    state.phase = "placing";
    held = null; selected = null;
    layoutTray();
    render();
    playAmbient();                                     // 새 방 진입 → 챕터 톤의 앰비언트 패드(비게이트·no-op 가드)
    return true;
  }

  // 분기: 선택 id → branch 텍스트(결정론 resolver·선택별 상이).
  function resolveBranch(choiceId) {

    return null;
  }
  function choose(choiceId) {

    state.choices[state.chapter - 1] = choiceId;       // AC7 carry: 챕터 인덱스 idempotent 덮어쓰기(append 금지)
    // 마지막 챕터(현재) 정리완료 후 선택 시 → 누적 선택의 순수 합성 에필로그 확정.
    if (state.chapter === state.totalChapters && state.phase === "complete") {
      state.epilogue = resolveEpilogue(state.choices);
    }
    A.play("choose");
    render();
    return b;
  }

  function toggleHint() { state.hintOn = !state.hintOn; syncHintBtn(); render(); return state.hintOn; }

  function resetGame() {
    state.chapter = 1; state.placed = {}; state.narrativeBeatShown = false;
    state.branch = null; state.hintOn = false; state.phase = "placing";
    state.choices = []; state.lastVignette = null; state.epilogue = null;   // R2: 런 간 잔존 0(carry 깨끗이 시작)

    layoutTray(); syncHintBtn(); render();
  }

  window.__placeItem = placeItem;
  window.__chapterComplete = chapterComplete;
  window.__advanceChapter = advanceChapter;
  window.__choose = choose;
  window.__toggleHint = toggleHint;
  window.__resolveEpilogue = resolveEpilogue;   // AC7: 순수 합성(동일 choices→동일 출력) 단언용
  window.__epilogueCoda = epilogueCoda;         // M-AC10: 에필로그 패턴 코다(순수·패턴 distinct·≤3 티어)
  window.__ambientPlan = __ambientPlan;         // M-AC9: 챕터별 앰비언트 모티프(순수·챕터 distinct·성부열)
  window.__resetGame = resetGame;               // AC7: carry-forward 양팔 격리(런 간 깨끗이 시작)
  // QA 구동 훅(좌표·정답매핑) — 단언은 항상 placeItem/실입력 경유(우회 아님).

  window.__vignettes = function () { var m = {}; curItems().forEach(function (it) { m[it.id] = it.vignette; }); return m; };  // AC8: 아이템별 비네트
  window.__geom = function () {

    var slots = {}; curSlots().forEach(function (s) { slots[s.id] = { x: s.pos.x, y: s.pos.y, w: s.pos.w, h: s.pos.h }; });

  // ── 입력: Pointer Events 단일 경로(마우스+터치) + CSS 스케일 보정 ──────────────
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var held = null, selected = null, ghost = { x: 0, y: 0 }, downPt = { x: 0, y: 0 }, moved = false;
  var uiButtons = [];           // render 가 채우는 화면 버튼(선택지/다음/다시)

  function handleButton(b) {

    else if (b.kind === "next") advanceChapter();
    else if (b.kind === "restart") resetGame();
  }

  canvas.addEventListener("pointerdown", function (e) {
    A.unlock();                                       // 첫 제스처서 오디오 unlock(autoplay 정책)
    playAmbient();                                     // 첫 제스처서 앰비언트 패드 swell(이후 챕터 전환마다)
    var p = toCanvas(e);
    var b = buttonAt(p.x, p.y);
    if (b) { handleButton(b); return; }
    if (state.phase !== "placing") return;
    var id = itemAt(p.x, p.y);
    if (id) { held = id; ghost = { x: p.x, y: p.y }; downPt = { x: p.x, y: p.y }; moved = false; render(); return; }
    var s = slotAt(p.x, p.y);

  canvas.addEventListener("pointerup", function (e) {

  });

  // ── HTML 버튼: 힌트·음소거 ──────────────────────────────────────────────────────
  var hintBtn = document.getElementById("hint");
  function syncHintBtn() { if (hintBtn) hintBtn.classList.toggle("on", state.hintOn); }

  // 비네트/에필로그 노출 노드(AC8/AC7 렌더 소비) — render() 가 state 에서 단일 동기화(vestigial echo 차단).
  var vignetteEl = document.getElementById("vignette");
  var epilogueEl = document.getElementById("epilogue");
  function syncNarrationDom() {
    if (vignetteEl) vignetteEl.textContent = state.lastVignette || "";
    if (epilogueEl) epilogueEl.textContent = state.epilogue || "";
  }
  if (hintBtn) hintBtn.addEventListener("click", function () { A.unlock(); toggleHint(); });

  var muteBtn = document.getElementById("mute");
  if (muteBtn) muteBtn.addEventListener("click", function () {
    if (!A.isUnlocked()) A.unlock();
    else muteBtn.textContent = A.toggleMute() ? "🔇" : "🔊";
  });

  // ── 렌더 ────────────────────────────────────────────────────────────────────────
  function wrapText(text, maxCh) {
    // monospace 근사 줄바꿈(공백 기준·한 줄 maxCh 자 상한).
    var words = text.split(" "), lines = [], line = "";
    for (var i = 0; i < words.length; i++) {
      var t = line ? line + " " + words[i] : words[i];
      if (t.length > maxCh && line) { lines.push(line); line = words[i]; }
      else line = t;
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawItemIcon(x, y, w, h, item, alpha) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;

    ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fillRect(x, y, w, 8);   // 베벨 하이라이트
    ctx.strokeStyle = "#0d0a16"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = "#160f24"; ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
    ctx.fillText(item.label, x + w / 2, y + h / 2 + 5);
    ctx.textAlign = "left"; ctx.globalAlpha = 1;
  }

  function drawButton(rect, text, fill) {
    ctx.fillStyle = fill; ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    ctx.strokeStyle = "#e7e0ef"; ctx.lineWidth = 1; ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = "#160f24"; ctx.font = "bold 15px monospace"; ctx.textAlign = "center";
    ctx.fillText(text, rect.x + rect.w / 2, rect.y + rect.h / 2 + 5);
    ctx.textAlign = "left";
  }

  function render() {
    uiButtons = [];
    syncNarrationDom();                 // AC8/AC7: lastVignette·epilogue 를 노출 DOM 노드에 렌더 소비
    var ch = curChapter();

    // 배경(방 분위기: 벽/바닥 분할 + 챕터 틴트)
    ctx.fillStyle = "#0d0a16"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = ch.tint; ctx.fillRect(0, 40, canvas.width, 360);            // 방 영역
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(0, 360, canvas.width, 40); // 바닥 그림자
    // 결정론 먼지 입자(시드 고정·장식)

    ctx.fillStyle = "#c8b8e6"; ctx.font = "15px monospace"; ctx.textAlign = "left";

    ctx.textAlign = "left";

    for (var i = 0; i < ch.slots.length; i++) {

      } else if (state.hintOn && state.phase === "placing") {
        // 힌트 오버레이: 이 슬롯의 정답 아이템을 정답 위치에 흐리게 표시(접근성).
        var want = null;
        for (var w2 = 0; w2 < ch.items.length; w2++) { if (ch.items[w2].slot === s.id) { want = ch.items[w2]; break; } }
        if (want && !isPlaced(want.id)) {

          ctx.strokeStyle = "#9b7bd4"; ctx.lineWidth = 2; ctx.strokeRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
          drawItemIcon(r.x + 16, r.y + 30, r.w - 32, r.h - 42, want, 0.35);

    }

    ctx.fillStyle = "#9a8fb0"; ctx.font = "12px monospace";
    ctx.fillText(state.phase === "placing" ? "정리할 물건 (끌어다 놓기 · 또는 탭해서 고르기)" : "방을 다 정리했습니다", 18, 452);
    var tr = trayItemRects();
    for (var ti = 0; ti < tr.length; ti++) {
      var rt = tr[ti];
      if (rt.id === held) continue;                 // 드래그 중인 건 고스트로
      drawItemIcon(rt.x, rt.y, rt.w, rt.h, itemById(rt.id), 1);

    }

    // 드래그 고스트

    // 서사 패널(정리완료 → 비트 + 선택지/분기/다음)
    if (state.narrativeBeatShown) {
      var pnl = { x: 24, y: 168, w: 432, h: 244 };
      ctx.fillStyle = "rgba(13,10,22,0.92)"; ctx.fillRect(pnl.x, pnl.y, pnl.w, pnl.h);
      ctx.strokeStyle = "#9b7bd4"; ctx.lineWidth = 2; ctx.strokeRect(pnl.x, pnl.y, pnl.w, pnl.h);
      ctx.fillStyle = "#e7c98b"; ctx.font = "13px monospace";
      ctx.fillText("◇ 그 시절의 기억", pnl.x + 16, pnl.y + 26);
      ctx.fillStyle = "#e7e0ef"; ctx.font = "13px monospace";
      var bl = wrapText(ch.beat, 30), by = pnl.y + 50;
      for (var b2 = 0; b2 < bl.length; b2++) { ctx.fillText(bl[b2], pnl.x + 16, by); by += 20; }

      if (state.branch == null) {
        // 선택지 버튼(분기 미선택)
        ctx.fillStyle = "#9a8fb0"; ctx.font = "12px monospace";
        ctx.fillText("이 물건을 어떻게 할까?", pnl.x + 16, by + 6);
        for (var c = 0; c < ch.choices.length; c++) {
          var bt = { kind: "choice", id: ch.choices[c].id, x: pnl.x + 16, y: by + 16 + c * 50, w: pnl.w - 32, h: 42 };
          drawButton(bt, ch.choices[c].label, c === 0 ? "#c8b8e6" : "#b0a3c8");
          uiButtons.push(bt);
        }
      } else {
        // 분기 결과 + 다음/다시 버튼
        ctx.fillStyle = "#a8e6c8"; ctx.font = "13px monospace";
        var brl = wrapText("→ " + state.branch, 30), brY = by + 4;
        for (var br = 0; br < brl.length; br++) { ctx.fillText(brl[br], pnl.x + 16, brY); brY += 20; }
        var nb;
        if (state.phase === "complete") {
          ctx.fillStyle = "#e7c98b"; ctx.font = "13px monospace";
          ctx.fillText("◇ 여정의 끝 — 네 방의 기억이 한 사람을 이룬다.", pnl.x + 16, brY + 6);
          if (state.epilogue) {                       // 누적 선택 합성 에필로그(전문은 #epilogue 노드에 렌더)
            ctx.fillStyle = "#c8b8e6"; ctx.font = "11px monospace";
            var epl = wrapText(state.epilogue, 34), epY = brY + 26;
            for (var e = 0; e < epl.length && e < 4; e++) { ctx.fillText(epl[e], pnl.x + 16, epY); epY += 16; }
          }
          nb = { kind: "restart", id: "r", x: pnl.x + 16, y: pnl.y + pnl.h - 50, w: pnl.w - 32, h: 40 };
          drawButton(nb, "처음부터 다시", "#c8b8e6");
        } else {
          nb = { kind: "next", id: "n", x: pnl.x + 16, y: pnl.y + pnl.h - 54, w: pnl.w - 32, h: 42 };
          drawButton(nb, "다음 방으로 →", "#c8b8e6");
        }
        uiButtons.push(nb);
      }
    }
  }

  // ── init ───────────────────────────────────────────────────────────────────────
  layoutTray();
  syncHintBtn();
  render();
})();
</script>
</body>
</html>
